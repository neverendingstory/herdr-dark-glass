id = "linyu.social-glass"
name = "Herdr Social Glass"
version = "1.3.0"
min_herdr_version = "0.8.2"
description = "Three screenshot-friendly workspace themes and macOS Terminal launchers for Herdr, including transparent Dark Glass integrations."
platforms = ["macos"]

[[actions]]
id = "apply"
title = "Apply Social Glass theme"
command = ["bash", "scripts/apply.sh"]

[[actions]]
id = "apply-island"
title = "Apply Island Glass theme"
command = ["bash", "scripts/apply-island.sh"]

[[actions]]
id = "apply-dark-glass"
title = "Apply Dark Glass theme"
command = ["bash", "scripts/apply-dark-glass.sh"]

[[actions]]
id = "setup-dark-glass"
title = "Set up Dark Glass integrations"
command = ["bash", "scripts/setup-dark-glass.sh"]

[[actions]]
id = "restore"
title = "Restore pre-theme config"
command = ["bash", "scripts/restore.sh"]

[[actions]]
id = "open-window"
title = "Open Social Glass Terminal window"
command = ["bash", "scripts/open-social-window.sh"]

[[actions]]
id = "open-island-window"
title = "Open Island Glass Terminal window"
command = ["bash", "scripts/open-island-window.sh"]

[[actions]]
id = "open-dark-glass-window"
title = "Open Dark Glass Terminal window"
command = ["bash", "scripts/open-dark-glass-window.sh"]

[[actions]]
id = "cycle-dark-glass-opacity"
title = "Cycle Dark Glass opacity"
command = ["bash", "scripts/cycle-dark-glass-opacity.sh"]

[[actions]]
id = "status"
title = "Show Social Glass status"
command = ["bash", "scripts/status.sh"]

[[panes]]
id = "guide"
title = "Social Glass Guide"
placement = "popup"
width = "78%"
height = "72%"
command = ["bash", "scripts/guide.sh"]
